version: '3.8'

services:
  redis-stack:
    image: redis/redis-stack:latest
    container_name: redis-ai-course
    ports:
      - "6379:6379"   # Redis port
      - "8001:8001"   # RedisInsight visual UI
    volumes:
      - redis_data:/data
    environment:
      REDIS_ARGS: "--save 60 1 --loglevel warning"
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
